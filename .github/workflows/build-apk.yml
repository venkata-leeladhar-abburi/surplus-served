name: Build Mobile App APK

on:
  push:
    branches: [ main, master, mobile-app-scaffold ]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies in design system
        run: flutter pub get
        working-directory: packages/ss_design_system

      - name: Install dependencies in mobile app
        run: flutter pub get
        working-directory: apps/mobile

      - name: Build Debug APK
        run: flutter build apk --debug
        working-directory: apps/mobile

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: surplus-to-served-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
