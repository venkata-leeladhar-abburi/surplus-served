name: Build Mobile App APK

on:
  push:
    branches: [ main, master, mobile-app-scaffold ]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: # Allows you to manually trigger a build anytime from the Actions tab

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Build Release APK
        run: flutter build apk --release
        working-directory: apps/mobile

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: surplus-to-served-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
