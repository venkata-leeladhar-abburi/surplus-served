name: Backend API tests

on:
  push:
    paths: ['apps/backend/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['apps/backend/**', '.github/workflows/backend-tests.yml']
  workflow_dispatch:

jobs:
  api-e2e:
    name: API end-to-end (in-memory MongoDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Uses throwaway test secrets and a temporary database; no repository
      # secrets are needed and the real database is never touched.
      - name: Run API tests
        run: npm test
