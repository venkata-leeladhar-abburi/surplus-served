
name: surplus_served_mobile
description: "Surplus → Served — Donor and NGO app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  http_parser: ^4.0.2
  file_picker: ^13.3.2
  # Opens NGO certificate PDFs for the admin (official flutter.dev plugin).
  url_launcher: ^6.3.1

  flutter_localizations:
    sdk: flutter

  ss_design_system:
    path: ../../packages/ss_design_system

  # Routing — role guards, deep links
  go_router: ^14.6.2

  # State management
  flutter_riverpod: ^2.6.1

  intl: any
  cupertino_icons: ^1.0.8
  connectivity_plus: ^7.3.1
  geolocator: ^14.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
