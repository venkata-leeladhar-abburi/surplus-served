name: surplus_served_mobile
description: "Surplus → Served — Donor and Receiver app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  ss_design_system:
    path: ../../packages/ss_design_system

  # Routing — role guards, deep links (ARCHITECTURE.md §2)
  go_router: ^14.6.2

  # State — AsyncNotifier per screen, ref.watch in build / ref.read in callbacks
  flutter_riverpod: ^2.6.1

  intl: any
  cupertino_icons: ^1.0.8
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
